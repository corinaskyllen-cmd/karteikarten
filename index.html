<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Karteikasten">
<meta name="theme-color" content="#D8D5C9">
<title>Karteikasten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
:root{
  --desk:#D8D5C9; --desk-dark:#2B2A26; --stock:#FFFDF7; --stock-2:#F6F3EA;
  --ink:#22201C; --muted:#736D63; --line:#CFC9BC; --rule:#C8D8E8;
  --red:#BE4F3B; --pen:#27477C; --pen-2:#1A3159;
  --hl-a:#FFE45E; --hl-b:#9FE870; --hl-s:#DFDBCC;
  --ok:#2F7A52; --warn:#B4762A;
  --r:5px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body{
  background:var(--desk);
  color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;font-family:"Fraunces",Georgia,serif;font-weight:600;letter-spacing:-.01em}
.mono{font-family:"IBM Plex Mono",monospace}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}

/* ---------- Grundlayout ---------- */
.app{display:grid;grid-template-columns:270px 1fr;height:100%;height:100dvh;overflow:hidden}
.rail{background:var(--desk-dark);color:#E9E5DA;display:flex;flex-direction:column;overflow:hidden}
.rail-head{padding:18px 16px 12px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand{font-family:"Fraunces",serif;font-size:20px;font-weight:700;color:#FFFDF7;display:flex;align-items:center;gap:8px}
.brand em{font-style:normal;color:var(--hl-a)}
.brand-sub{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#9A9384;margin-top:4px;font-family:"IBM Plex Mono",monospace}
.rail-body{flex:1;overflow-y:auto;padding:10px 0 20px}
.rail-foot{border-top:1px solid rgba(255,255,255,.09);padding:10px 12px;display:flex;gap:6px;flex-wrap:wrap}

.rail-sec{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#8E8878;padding:12px 16px 6px;font-family:"IBM Plex Mono",monospace}
.tab{
  display:flex;align-items:center;gap:8px;width:calc(100% - 10px);margin-left:10px;
  padding:7px 10px;border:0;background:transparent;color:#DCD7CA;text-align:left;
  border-radius:var(--r) 0 0 var(--r);font-size:14px;position:relative
}
.tab:hover{background:rgba(255,255,255,.07)}
.tab.on{background:var(--stock);color:var(--ink);font-weight:500;box-shadow:-2px 0 0 var(--red) inset}
.tab .cnt{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;color:#8E8878}
.tab.on .cnt{color:var(--muted)}
.tab.sub{padding-left:26px;font-size:13.5px}
.tab.sub::before{content:"";position:absolute;left:14px;top:50%;width:5px;height:1px;background:currentColor;opacity:.45}
.tab-row{display:flex;align-items:center}
.tab-row .mini{opacity:0;background:none;border:0;color:#B9B3A4;padding:4px 6px;font-size:13px;border-radius:4px}
.tab-row:hover .mini{opacity:1}
.tab-row .mini:hover{background:rgba(255,255,255,.1);color:#fff}

/* ---------- Hauptbereich ---------- */
main{overflow-y:auto;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;background:var(--desk);
  border-bottom:1px solid var(--line);padding:10px 22px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap
}
.crumb{font-size:13px;color:var(--muted)}
.crumb b{color:var(--ink);font-weight:600}
.views{display:flex;gap:2px;margin-left:auto;background:rgba(0,0,0,.06);padding:3px;border-radius:6px}
.views button{border:0;background:transparent;padding:6px 13px;border-radius:4px;font-size:13.5px;color:var(--muted)}
.views button.on{background:var(--stock);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.wrap{padding:26px 22px 80px;max-width:1080px;width:100%;margin:0 auto;flex:1}
.burger{display:none}

.pill{margin-left:auto;display:inline-flex;align-items:center;gap:7px;background:var(--stock);border:1px solid var(--line);
  border-radius:99px;padding:4px 12px 4px 10px;font-size:12.5px;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.pill:hover{border-color:var(--pen);color:var(--ink)}
.pill.ok::before{background:var(--ok)}
.pill.busy::before{background:var(--warn);animation:pulse 1s infinite}
.pill.err::before{background:var(--red)}
.pill.err{color:var(--red)}
@keyframes pulse{50%{opacity:.25}}
.views{margin-left:0}
.sql{width:100%;font-family:"IBM Plex Mono",monospace;font-size:11.5px;line-height:1.55;background:#fff;border:1px solid var(--line);
  border-radius:var(--r);padding:10px;min-height:150px;white-space:pre;overflow:auto}
.steps{counter-reset:st;list-style:none;padding:0;margin:0 0 16px}
.steps li{counter-increment:st;position:relative;padding-left:26px;margin-bottom:7px;font-size:13.5px;color:var(--muted)}
.steps li::before{content:counter(st);position:absolute;left:0;top:1px;width:18px;height:18px;border-radius:50%;background:var(--stock-2);
  border:1px solid var(--line);font-family:"IBM Plex Mono",monospace;font-size:10.5px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.steps b{color:var(--ink)}

/* ---------- Bausteine ---------- */
.btn{background:var(--pen);color:#fff;border:1px solid var(--pen-2);padding:8px 14px;border-radius:var(--r);font-size:14px;font-weight:500}
.btn:hover{background:var(--pen-2)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:rgba(0,0,0,.05)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{background:transparent;color:var(--red);border-color:rgba(190,79,59,.4)}
.btn.danger:hover{background:rgba(190,79,59,.09)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.panel{background:var(--stock);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel + .panel{margin-top:16px}
.panel h2{font-size:19px;margin-bottom:4px}
.lead{color:var(--muted);font-size:13.5px;margin:0 0 14px}
label.f{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;font-family:"IBM Plex Mono",monospace}
input[type=text],input[type=date],select,textarea{
  width:100%;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px
}
textarea{resize:vertical;min-height:80px;line-height:1.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-family:"IBM Plex Mono",monospace;background:var(--stock-2);border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--muted)}
.empty{text-align:center;padding:46px 20px;color:var(--muted)}
.empty h2{margin-bottom:8px;color:var(--ink)}
.hint{font-size:12.5px;color:var(--muted)}
.sep{height:1px;background:var(--line);margin:16px 0}
kbd{font-family:"IBM Plex Mono",monospace;font-size:11px;background:var(--stock-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px}

.quick{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.quick button{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);
  border-radius:99px;padding:6px 14px;font-size:13.5px}
.quick button:hover{border-color:var(--pen);background:var(--stock-2)}
.quick b{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted)}
.d{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;display:inline-block;margin-right:5px;vertical-align:1px}
.d0{background:#9aa4b0} .d1{background:var(--red)} .d2{background:var(--warn)} .d3{background:var(--ok)} .dD{background:var(--pen)}
.duebox{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--stock-2);border:1px solid var(--line);
  border-left:3px solid var(--pen);border-radius:var(--r);padding:11px 14px;margin-bottom:16px;font-size:14px}
.duebox b{font-family:"IBM Plex Mono",monospace}
.duebox .btn{margin-left:auto}
.duebox.off{border-left-color:var(--muted);color:var(--muted)}
.bd .v.now{background:var(--red)}

/* ---------- Karteikarte ---------- */
.kk{perspective:1600px;margin:0 auto;max-width:680px}
.kk-inner{display:grid;transition:transform .45s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.kk.flip .kk-inner{transform:rotateY(180deg)}
.face{
  grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--stock);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:0 1px 0 #fff inset, 0 6px 18px rgba(40,36,28,.13);
  padding:36px 28px 26px 56px;min-height:260px;position:relative;--lh:32px;
  background-image:
    linear-gradient(to right, transparent 43px, rgba(190,79,59,.5) 43px, rgba(190,79,59,.5) 44px, transparent 44px),
    repeating-linear-gradient(to bottom, transparent 0 calc(var(--lh) - 1px), rgba(200,216,232,.5) calc(var(--lh) - 1px) var(--lh));
  background-position:0 0, 0 36px;
}
.face.b{transform:rotateY(180deg)}
.face .tagline{position:absolute;top:11px;left:56px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.face .txt{font-family:"Fraunces",Georgia,serif;font-size:21px;line-height:var(--lh)}
.face.s1{--lh:34px} .face.s1 .txt{font-size:22px}
.face.s2{--lh:30px} .face.s2 .txt{font-size:19px}
.face.s3{--lh:27px} .face.s3 .txt{font-size:17px}
.face.s4{--lh:24px} .face.s4 .txt{font-size:15.5px}
.ln{margin:0}
.ln.bl{padding-left:1.15em;text-indent:-1.15em}
.ln.bl::before{content:"•";color:var(--red);margin-right:.45em}
.ln.sp{height:.5em}
.kk-actions{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.bar{height:4px;background:rgba(0,0,0,.1);border-radius:9px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--pen);transition:width .3s}

/* ---------- Werkzeugleiste ---------- */
.tools{display:flex;gap:4px}
.tb{width:28px;height:26px;border:1px solid var(--line);background:#fff;border-radius:4px;font-size:13px;line-height:1;color:var(--muted)}
.tb:hover{border-color:var(--pen);color:var(--ink);background:var(--stock-2)}
.tb.bo{font-weight:700;font-family:"Fraunces",serif}
.tb.it{font-style:italic;font-family:"Fraunces",serif}
.face .txt b{font-weight:700}
.face .txt i{font-style:italic}
.kpi b{font-weight:700} .kpi i{font-style:italic}

/* ---------- Kernpunkte ---------- */
.kphint{text-align:center;font-size:12.5px;color:var(--muted);margin-top:14px;font-family:"IBM Plex Mono",monospace}
.kpbox{max-width:680px;margin:16px auto 0;background:var(--stock);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kph{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-family:"IBM Plex Mono",monospace;margin-bottom:9px;display:flex;justify-content:space-between}
.kph b{color:var(--ink);letter-spacing:0}
.kpi{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);
  border-radius:var(--r);padding:9px 11px;margin-bottom:6px;font-size:14.5px;line-height:1.4;font-family:"Fraunces",Georgia,serif}
.kpi:last-child{margin-bottom:0}
.kpi .cb{flex:none;width:19px;height:19px;border:1px solid var(--line);border-radius:4px;background:var(--stock-2);
  color:transparent;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.kpi.on{border-color:var(--ok);background:rgba(47,122,82,.06)}
.kpi.on .cb{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sug{box-shadow:0 0 0 2px rgba(39,71,124,.35);position:relative}
.kpn{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.kpstat{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
.kpstat b{font-family:"IBM Plex Mono",monospace;color:var(--ink)}

/* ---------- Kartenliste ---------- */
.filterbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.bg{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:4px;
  font-size:10px;margin-right:6px;vertical-align:1px;line-height:1}
.bg.m{background:rgba(47,122,82,.14);color:var(--ok)}
.bg.s{background:rgba(190,79,59,.14);color:var(--red)}
.legend .bg{margin-right:6px}
.quick .bg{margin-right:2px}
.clist{display:flex;flex-direction:column;gap:8px}
.crow{display:grid;grid-template-columns:1fr 1fr auto;gap:14px;align-items:start;background:var(--stock);border:1px solid var(--line);border-left:3px solid var(--red);border-radius:var(--r);padding:11px 12px}
.crow .f1{font-weight:500}
.crow .f2{color:var(--muted);font-size:14px}
.crow .acts{display:flex;gap:4px}
.crow .acts button{background:none;border:1px solid transparent;border-radius:4px;padding:3px 7px;font-size:12.5px;color:var(--muted)}
.crow .acts button:hover{border-color:var(--line);color:var(--ink);background:#fff}
.box{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted)}

/* ---------- Dokument-Leser ---------- */
.reader-grid{display:grid;grid-template-columns:1fr 330px;gap:16px;align-items:start}
#reader{
  background:var(--stock);border:1px solid var(--line);border-radius:var(--r);
  padding:26px 30px;max-height:calc(100vh - 220px);overflow-y:auto;
  font-family:"Fraunces",Georgia,serif;font-size:16.5px;line-height:1.72;
}
.blk{margin:0 0 10px;scroll-margin-top:20px}
.blk.h1{font-size:24px;font-weight:700;margin:24px 0 10px}
.blk.h2{font-size:20px;font-weight:600;margin:20px 0 8px}
.blk.h3,.blk.h4{font-size:17px;font-weight:600;margin:16px 0 6px}
.blk.li{padding-left:20px;position:relative}
.blk.li::before{content:"–";position:absolute;left:4px;color:var(--muted)}
.blk::selection,.blk *::selection{background:rgba(39,71,124,.22)}
.mk{
  background-image:linear-gradient(102deg,transparent .4%,var(--c) 1.4%,var(--c) 98.4%,transparent 99.6%);
  box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:1px 2px;border-radius:1px
}
.mk-front{--c:var(--hl-a)}
.mk-back{--c:var(--hl-b)}
.mk-saved{--c:var(--hl-s)}
.side{position:sticky;top:74px}
.pend{background:var(--stock);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.pend h3{font-size:15px;margin-bottom:2px}
.marker-btn{flex:1;border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:7px 6px;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
.marker-btn:hover{background:var(--stock-2)}
.swatch{width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.15)}
.sw-a{background:var(--hl-a)} .sw-b{background:var(--hl-b)}
.pend textarea{min-height:62px;font-family:"Fraunces",Georgia,serif;font-size:15px}

/* ---------- Dokumentliste ---------- */
.dcard{display:flex;gap:12px;align-items:center;background:var(--stock);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.dcard .ico{width:34px;height:42px;background:#fff;border:1px solid var(--line);border-radius:2px;position:relative;flex:none;
  background-image:repeating-linear-gradient(to bottom,transparent 0 7px,var(--line) 7px 8px);background-position:0 9px;background-size:100% 100%}
.dcard .ico::after{content:"";position:absolute;top:0;right:0;border-width:0 9px 9px 0;border-style:solid;border-color:var(--desk) var(--desk) var(--line) var(--line)}
.dcard .meta{flex:1;min-width:0}
.dcard .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- Statistik ---------- */
.kpi{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.kpi>div{background:var(--stock);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px;text-align:center}
.kpi .n{font-family:"Fraunces",serif;font-size:29px;line-height:1.1}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:3px}
.bars{display:flex;gap:5px;align-items:flex-end;height:130px;padding-top:8px}
.bd{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:3px}
.bd .v{width:100%;max-width:34px;background:var(--pen);border-radius:2px 2px 0 0;min-height:2px}
.bd em{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted);font-style:normal;order:-1}
.bd .lb{font-size:10.5px;color:var(--muted)}
.stack{display:flex;height:11px;border-radius:99px;overflow:hidden;background:var(--stock-2);border:1px solid var(--line)}
.stack i{display:block}
.stack .g{background:var(--ok)} .stack .y{background:var(--warn)} .stack .r{background:var(--red)} .stack .n{background:#B9B3A4}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.legend .g{background:var(--ok)} .legend .y{background:var(--warn)} .legend .r{background:var(--red)} .legend .n{background:#B9B3A4}
.tbl{display:flex;flex-direction:column}
.tr{display:grid;grid-template-columns:1fr 170px 46px;gap:14px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.tr:first-child{border-top:0}
.tr .c1{font-size:14px}
.tr .c1 .box{display:block;margin-top:1px}
.tr .c3{text-align:right;font-size:13px;color:var(--muted)}
.hist{display:flex;gap:3px;align-items:center}
.lastline{text-align:center;font-size:12.5px;color:var(--muted);margin-top:14px;font-family:"IBM Plex Mono",monospace}

/* ---------- Overlay ---------- */
.ov{position:fixed;inset:0;background:rgba(28,26,22,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:100}
.ov[hidden]{display:none}
.modal{background:var(--stock);border:1px solid var(--line);border-radius:7px;max-width:720px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal .head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .head h2{font-size:18px}
.modal .body{padding:18px 20px}
.modal .foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--stock)}
.x{margin-left:auto;background:none;border:0;font-size:20px;line-height:1;color:var(--muted)}
.prev{display:flex;flex-direction:column;gap:7px;max-height:46vh;overflow:auto;padding-right:4px}
.prev label{display:grid;grid-template-columns:auto 1fr;gap:10px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;cursor:pointer;align-items:start}
.prev label:hover{border-color:var(--pen)}
.prev .q{font-weight:500;font-size:14px}
.prev .a{color:var(--muted);font-size:13px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--desk-dark);color:#FFFDF7;padding:10px 18px;border-radius:6px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:200}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- Ergebnis ---------- */
.res{text-align:center;padding:20px}
.res .big{font-family:"Fraunces",serif;font-size:56px;line-height:1;margin:10px 0}
.stat{display:flex;gap:26px;justify-content:center;margin:20px 0}
.stat div{text-align:center}
.stat .n{font-family:"IBM Plex Mono",monospace;font-size:24px}
.stat .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

@media (max-width:900px){
  .reader-grid{grid-template-columns:1fr}
  .side{position:static}
  .grid2{grid-template-columns:1fr}
}
/* ---------- Telefon ---------- */
.navback{display:none}
.bottomnav{display:none}
.mbar{display:none}
@media (max-width:820px){
  .navback{display:block;position:fixed;inset:0;background:rgba(28,26,22,.5);z-index:55;opacity:0;pointer-events:none;transition:opacity .2s}
  body.nav .navback{opacity:1;pointer-events:auto}
  .views{display:none}
  .bottomnav{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:var(--stock);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 12px rgba(40,36,28,.08)
  }
  .bottomnav button{flex:1;border:0;background:none;padding:11px 2px;font-size:12.5px;color:var(--muted);border-top:2px solid transparent}
  .bottomnav button.on{color:var(--pen);font-weight:600;border-top-color:var(--pen)}
  .wrap{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  input[type=text],input[type=date],select,textarea{font-size:16px}
  .tab-row .mini{opacity:1}
  .crumb{font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pill{margin-left:0;font-size:11.5px;padding:3px 9px}
  #reader{max-height:none;padding:20px 16px;font-size:16px}
  .kk-inner{transform:none!important;transform-style:flat}
  .face{position:relative;transform:none!important;box-shadow:0 2px 10px rgba(40,36,28,.12)}
  .kk .face.b{display:none} .kk.flip .face{display:none} .kk.flip .face.b{display:block}
  .side{margin-bottom:8px}
  body.marking .wrap{padding-bottom:calc(190px + env(safe-area-inset-bottom))}
  .mbar{
    display:block;position:fixed;left:0;right:0;bottom:0;z-index:52;background:var(--stock);
    border-top:1px solid var(--line);padding:9px 10px calc(9px + env(safe-area-inset-bottom));
    box-shadow:0 -3px 14px rgba(40,36,28,.14)
  }
  .mbar .mprev{font-size:11.5px;color:var(--muted);margin-bottom:7px;display:flex;gap:10px}
  .mbar .mprev span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mbar .mrow{display:flex;gap:6px}
  .mbar .mb{flex:1;border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:11px 4px;font-size:13.5px;font-weight:500}
  .mbar .mb.a{background:var(--hl-a);border-color:#E8CB4E}
  .mbar .mb.b{background:var(--hl-b);border-color:#8CD25E}
  .mbar .mb.go{background:var(--pen);border-color:var(--pen-2);color:#fff}
  .mbar .mb.x{flex:0 0 44px;color:var(--muted)}
  body.marking .bottomnav{display:none}
  .app{grid-template-columns:1fr}
  .rail{position:fixed;inset:0 auto 0 0;width:272px;z-index:60;transform:translateX(-100%);transition:transform .25s;box-shadow:6px 0 24px rgba(0,0,0,.3)}
  body.nav .rail{transform:none}
  .burger{display:inline-flex;background:none;border:1px solid var(--line);border-radius:var(--r);padding:6px 10px}
  .wrap{padding:20px 14px 90px}
  .topbar{padding:9px 14px}
  .crow{grid-template-columns:1fr;gap:4px}
  .filterbar{grid-template-columns:1fr;gap:7px}
  .kpi{grid-template-columns:repeat(3,1fr)}
  .kpi .n{font-size:24px}
  .tr{grid-template-columns:1fr 90px 40px;gap:8px}
  .views button{padding:6px 9px;font-size:12.5px}
  .face{padding:30px 16px 20px 44px}
  .face.s1 .txt{font-size:19px} .face.s2 .txt{font-size:17.5px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" id="rail">
    <div class="rail-head">
      <div class="brand">Kartei<em>kasten</em></div>
      <div class="brand-sub">Vom Skript zur Karte</div>
    </div>
    <div class="rail-body" id="railBody"></div>
    <div class="rail-foot">
      <button class="btn sm ghost" data-act="new-subject" style="color:#E9E5DA;border-color:rgba(255,255,255,.2)">+ Fach</button>
      <button class="btn sm ghost" data-act="export" style="color:#E9E5DA;border-color:rgba(255,255,255,.2)">Sichern</button>
      <button class="btn sm ghost" data-act="import" style="color:#E9E5DA;border-color:rgba(255,255,255,.2)">Laden</button>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <button class="burger" data-act="nav">☰</button>
      <div class="crumb" id="crumb"></div>
      <button class="pill" id="syncPill" data-act="sync-open" title="Synchronisation">Sync einrichten</button>
      <div class="views" id="views">
        <button data-act="view" data-v="lernen">Lernen</button>
        <button data-act="view" data-v="dokumente">Dokumente</button>
        <button data-act="view" data-v="karten">Karten</button>
        <button data-act="view" data-v="statistik">Statistik</button>
      </div>
    </div>
    <div class="wrap" id="wrap"></div>
  </main>
</div>

<div class="navback" data-act="nav"></div>
<nav class="bottomnav" id="bnav">
  <button data-act="view" data-v="lernen">Lernen</button>
  <button data-act="view" data-v="dokumente">Dokumente</button>
  <button data-act="view" data-v="karten">Karten</button>
  <button data-act="view" data-v="statistik">Statistik</button>
</nav>
<div class="ov" id="ov" hidden><div class="modal" id="modal"></div></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept=".docx,.txt,.md,.html" hidden multiple>
<input type="file" id="jsonIn" accept=".json" hidden>

<script>
/* ============ Helfer ============ */
const $ = (s, r) => (r || document).querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cut = (s, n) => (s || '').length > n ? s.slice(0, n).trim() + '…' : (s || '');
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2200);
}

/* ============ Zustand + Speicher ============ */
let S = { subjects: [], cards: [], docs: [], log: [], del: {}, sel: { sid: null, cid: null }, view: 'lernen' };
let sess = null;
let reader = { docId: null, pend: { front: [], back: [] }, text: { front: '', back: '', kp: '' }, auto: { front: true, back: true }, painted: null, scroll: 0 };

const KEY = 'karteikasten_v1';
let saveTimer = null;
/* Speicher: nutzt window.storage (Claude-Artefakt), sonst localStorage (eigene Seite / GitHub Pages) */
async function put(k, v) {
  if (window.storage) return window.storage.set(k, v);
  localStorage.setItem(k, v);
}
async function get(k) {
  if (window.storage) { const r = await window.storage.get(k); return r && r.value; }
  return localStorage.getItem(k);
}
function snapshot() { return { subjects: S.subjects, cards: S.cards, docs: S.docs, log: S.log || [], del: S.del || {} }; }
function saveLocal() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const data = JSON.stringify(Object.assign(snapshot(), { sel: S.sel, view: S.view }));
    try { await put(KEY, data); } catch (e) { console.warn('Speichern fehlgeschlagen', e); }
  }, 350);
}
function save() { saveLocal(); schedulePush(); }
function touch(o) { if (o) o.mtime = Date.now(); return o; }
function tomb(id) { (S.del = S.del || {})[id] = Date.now(); }
async function load() {
  try {
    const raw = await get(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      S.subjects = d.subjects || []; S.cards = d.cards || []; S.docs = d.docs || []; S.log = d.log || []; S.del = d.del || {};
      S.sel = d.sel || { sid: null, cid: null }; S.view = d.view || 'lernen';
    }
  } catch (e) { /* noch nichts gespeichert */ }
}

/* ============ Zugriffe ============ */
const subj = id => S.subjects.find(s => s.id === id);
const doc_ = id => S.docs.find(d => d.id === id);
const card_ = id => S.cards.find(c => c.id === id);
function chapName(sid, cid) {
  if (!cid) return 'Ohne Kapitel';
  const s = subj(sid); if (!s) return '—';
  const c = (s.chapters || []).find(x => x.id === cid);
  return c ? c.name : 'Ohne Kapitel';
}
function inScope(o) {
  if (!S.sel.sid) return true;
  if (o.sid !== S.sel.sid) return false;
  if (S.sel.cid === null) return true;
  if (S.sel.cid === '__none__') return !o.cid;
  return o.cid === S.sel.cid;
}
const scopeCards = () => S.cards.filter(inScope);
const scopeDocs = () => S.docs.filter(inScope);
function scopeLabel() {
  if (!S.sel.sid) return 'Alle Fächer';
  const s = subj(S.sel.sid); if (!s) return 'Alle Fächer';
  if (S.sel.cid === null) return s.name + ' · alle Kapitel';
  return s.name + ' · ' + (S.sel.cid === '__none__' ? 'Ohne Kapitel' : chapName(s.id, S.sel.cid));
}
function targetChapter(fallbackDoc) {
  if (S.sel.sid && S.sel.cid && S.sel.cid !== '__none__') return { sid: S.sel.sid, cid: S.sel.cid };
  if (fallbackDoc) return { sid: fallbackDoc.sid, cid: fallbackDoc.cid };
  return { sid: S.sel.sid, cid: null };
}

/* ============ Seitenleiste ============ */
function renderRail() {
  const all = S.cards.length;
  let h = '<div class="rail-sec">Fächer</div>';
  h += `<div class="tab-row"><button class="tab ${!S.sel.sid ? 'on' : ''}" data-act="pick" data-sid="" data-cid="">Alle Fächer<span class="cnt">${all}</span></button></div>`;
  for (const s of S.subjects) {
    const n = S.cards.filter(c => c.sid === s.id).length;
    const active = S.sel.sid === s.id;
    h += `<div class="tab-row">
      <button class="tab ${active && S.sel.cid === null ? 'on' : ''}" data-act="pick" data-sid="${s.id}" data-cid="">${esc(s.name)}<span class="cnt">${n}</span></button>
      <button class="mini" data-act="edit-subject" data-id="${s.id}" title="Fach bearbeiten">✎</button>
    </div>`;
    if (active) {
      for (const c of (s.chapters || [])) {
        const cn = S.cards.filter(x => x.cid === c.id).length;
        h += `<div class="tab-row">
          <button class="tab sub ${S.sel.cid === c.id ? 'on' : ''}" data-act="pick" data-sid="${s.id}" data-cid="${c.id}">${esc(c.name)}<span class="cnt">${cn}</span></button>
          <button class="mini" data-act="edit-chapter" data-id="${c.id}" data-sid="${s.id}" title="Kapitel bearbeiten">✎</button>
        </div>`;
      }
      const loose = S.cards.filter(x => x.sid === s.id && !x.cid).length;
      if (loose) h += `<div class="tab-row"><button class="tab sub ${S.sel.cid === '__none__' ? 'on' : ''}" data-act="pick" data-sid="${s.id}" data-cid="__none__">Ohne Kapitel<span class="cnt">${loose}</span></button></div>`;
      h += `<div class="tab-row"><button class="tab sub" data-act="new-chapter" data-sid="${s.id}" style="color:#9A9384">+ Kapitel</button></div>`;
    }
  }
  if (!S.subjects.length) h += '<div style="padding:14px 16px;font-size:13px;color:#9A9384;line-height:1.5">Noch kein Fach angelegt. Leg unten eins an – danach kannst du Skripte hochladen.</div>';
  $('#railBody').innerHTML = h;
}

/* ============ Router ============ */
function render() {
  renderRail();
  $('#crumb').innerHTML = '<b>' + esc(scopeLabel()) + '</b> · ' + scopeCards().length + ' Karten · ' + scopeDocs().length + ' Dokumente';
  [...$('#views').children, ...$('#bnav').children].forEach(b => b.classList.toggle('on', b.dataset.v === S.view));
  document.body.classList.toggle('marking', S.view === 'dokumente' && !!reader.docId);
  const w = $('#wrap');
  if (S.view === 'lernen') w.innerHTML = viewLernen();
  else if (S.view === 'karten') w.innerHTML = viewKarten();
  else if (S.view === 'statistik') w.innerHTML = viewStats();
  else w.innerHTML = viewDokumente();
  if (S.view === 'dokumente' && reader.docId) { paintReader(); updateBar(); }
  save();
}
function go(v) { if (v !== 'dokumente') reader.docId = null; S.view = v; render(); }

/* ============ Ansicht: Dokumente ============ */
function viewDokumente() {
  if (reader.docId) return viewReader();
  const ds = scopeDocs();
  let h = `<div class="panel">
    <h2>Dokumente</h2>
    <p class="lead">Lade dein Skript hoch, markier darin mit dem Textmarker Vorder- und Rückseite – daraus entstehen die Karten. Word (.docx), Text und Markdown funktionieren direkt.</p>
    <div class="row">
      <button class="btn" data-act="upload">Datei hochladen</button>
      <button class="btn ghost" data-act="paste">Text einfügen</button>
      <span class="hint">Google Docs: <b>Datei → Herunterladen → Microsoft Word (.docx)</b>, dann hier hochladen.</span>
    </div>
  </div>`;
  if (!ds.length) {
    h += `<div class="panel"><div class="empty"><h2>Noch kein Dokument</h2><p>Ein hochgeladenes Skript kannst du hier lesen, farbig markieren und in Karten zerlegen.</p></div></div>`;
    return h;
  }
  h += '<div class="panel"><h2 style="margin-bottom:12px">Deine Dokumente</h2><div class="clist">';
  for (const d of ds.slice().reverse()) {
    const n = S.cards.filter(c => c.docId === d.id).length;
    h += `<div class="dcard">
      <div class="ico"></div>
      <div class="meta">
        <div class="nm">${esc(d.name)}</div>
        <div class="hint">${esc(subj(d.sid) ? subj(d.sid).name : '—')} · ${esc(chapName(d.sid, d.cid))} · ${d.blocks.length} Absätze · <b>${n}</b> Karten</div>
      </div>
      <button class="btn sm" data-act="open-doc" data-id="${d.id}">Markieren</button>
      <button class="btn sm ghost" data-act="auto-doc" data-id="${d.id}">Auto-Scan</button>
      <button class="btn sm danger" data-act="del-doc" data-id="${d.id}">Löschen</button>
    </div>`;
  }
  h += '</div></div>';
  return h;
}

function viewReader() {
  const d = doc_(reader.docId);
  if (!d) { reader.docId = null; return viewDokumente(); }
  const n = S.cards.filter(c => c.docId === d.id).length;
  return `
  <div class="row" style="margin-bottom:14px">
    <button class="btn sm ghost" data-act="close-doc">← Dokumente</button>
    <b>${esc(d.name)}</b>
    <span class="chip">${esc(chapName(d.sid, d.cid))}</span>
    <span class="chip" id="docCount">${n} Karten</span>
    <button class="btn sm ghost" data-act="auto-doc" data-id="${d.id}" style="margin-left:auto">Auto-Scan</button>
  </div>
  <div class="reader-grid">
    <div id="reader"></div>
    <div class="side">
      <div class="pend">
        <h3>Neue Karte</h3>
        <p class="hint" style="margin:2px 0 12px">Text im Dokument markieren, dann Seite zuweisen.</p>
        <div class="row" style="gap:6px;margin-bottom:12px">
          <button class="marker-btn" data-act="mark" data-side="front"><span class="swatch sw-a"></span> Vorderseite <kbd>1</kbd></button>
          <button class="marker-btn" data-act="mark" data-side="back"><span class="swatch sw-b"></span> Rückseite <kbd>2</kbd></button>
        </div>
        <label class="f">Vorderseite (Frage)</label>
        <textarea id="pFront" class="rt" placeholder="Markier eine Überschrift oder Frage im Text …">${esc(reader.text.front)}</textarea>
        <div style="height:10px"></div>
        <div class="row" style="justify-content:space-between;align-items:baseline">
          <label class="f" style="margin:0">Rückseite (Antwort)</label>${TOOLS}
        </div>
        <textarea id="pBack" class="rt" placeholder="Markier die passende Erklärung …">${esc(reader.text.back)}</textarea>
        <div style="height:10px"></div>
        <div class="row" style="justify-content:space-between;align-items:baseline">
          <label class="f" style="margin:0">Kernpunkte zum Abhaken</label>
          <button class="btn sm ghost" data-act="kp-from-back">Aus Stichpunkten</button>
        </div>
        <textarea id="pKP" style="min-height:56px" placeholder="Eine Zeile je Kernpunkt (optional)">${esc(reader.text.kp || '')}</textarea>
        <div class="row" style="margin-top:12px">
          <button class="btn" data-act="save-mark">Karte anlegen</button>
          <button class="btn ghost sm" data-act="clear-mark">Leeren</button>
        </div>
        <div class="hint" style="margin-top:10px"><kbd>Strg</kbd>+<kbd>↵</kbd> legt die Karte an. Grau markiert = schon auf einer Karte.</div>
      </div>
    </div>
  </div>
  <div class="mbar">
    <div class="mprev" id="mPrev"></div>
    <div class="mrow">
      <button class="mb a" data-act="mark" data-side="front">Vorne</button>
      <button class="mb b" data-act="mark" data-side="back">Hinten</button>
      <button class="mb go" data-act="save-mark">Karte</button>
      <button class="mb x" data-act="clear-mark">✕</button>
    </div>
  </div>`;
}

/* ============ Ansicht: Karten ============ */
const SORTS = {
  new: { label: 'Neueste zuerst', fn: (a, b) => (b.created || 0) - (a.created || 0) },
  old: { label: 'Älteste zuerst', fn: (a, b) => (a.created || 0) - (b.created || 0) },
  doc: {
    label: 'Reihenfolge im Dokument', fn: (a, b) => {
      const da = a.docId ? (doc_(a.docId) || {}).created || 0 : 0, db = b.docId ? (doc_(b.docId) || {}).created || 0 : 0;
      return da - db || (a.ord || 0) - (b.ord || 0) || (a.created || 0) - (b.created || 0);
    }
  },
  az: { label: 'Vorderseite A–Z', fn: (a, b) => a.front.localeCompare(b.front, 'de') },
  last: { label: 'Zuletzt gelernt', fn: (a, b) => (b.last || 0) - (a.last || 0) },
  bad: {
    label: 'Häufigste Fehler zuerst', fn: (a, b) => {
      const f = c => (c.hist || []).filter(e => e.r === 1).length;
      return f(b) - f(a) || (b.reps || 0) - (a.reps || 0);
    }
  }
};
const KFILTER = {
  all: 'Alle Kategorien', due: 'Heute fällig', new: 'Neu – noch nie gelernt', r1: 'Falsch', r2: 'Teilweise', r3: 'Richtig',
  unsure: 'Falsch + teilweise', stuck: '⚠ Hängengeblieben (3 Lerntage falsch)', mastered: '★ Gefestigt (3 Lerntage richtig)'
};
function viewKarten() {
  const cs = scopeCards();
  const fk = window._f || 'all', sk = window._s || 'new';
  let h = `<div class="panel">
      <div class="row" style="justify-content:space-between;align-items:flex-start">
        <div><h2>Karten</h2><p class="lead" style="margin:0">${cs.length} Karten in ${esc(scopeLabel())}</p></div>
        <button class="btn" data-act="new-card">+ Karte</button>
      </div>
      <div class="sep" style="margin:14px 0"></div>
      <div class="filterbar">
        <input type="text" id="q" placeholder="Suchen …" value="${esc(window._q || '')}">
        <select id="kFilter">${Object.keys(KFILTER).map(k => `<option value="${k}" ${k === fk ? 'selected' : ''}>${esc(KFILTER[k])}${k !== 'all' ? ' (' + cs.filter(F[k]).length + ')' : ''}</option>`).join('')}</select>
        <select id="kSort">${Object.keys(SORTS).map(k => `<option value="${k}" ${k === sk ? 'selected' : ''}>${esc(SORTS[k].label)}</option>`).join('')}</select>
      </div>
    </div>`;
  const q = (window._q || '').toLowerCase();
  const list = cs.filter(F[fk] || F.all)
    .filter(c => !q || (c.front + ' ' + c.back).toLowerCase().includes(q))
    .sort(SORTS[sk] ? SORTS[sk].fn : SORTS.new.fn);
  if (!list.length) {
    if (fk !== 'all' || q) return h + `<div class="panel"><div class="empty"><h2>Nichts gefunden</h2><p>Zu diesem Filter gibt es hier keine Karten.</p><div class="row" style="justify-content:center;margin-top:14px"><button class="btn ghost" data-act="reset-filter">Filter zurücksetzen</button></div></div></div>`;
    h += `<div class="panel"><div class="empty"><h2>Keine Karten hier</h2><p>Schreib eine von Hand oder erstell sie aus einem Dokument.</p><div class="row" style="justify-content:center;margin-top:14px"><button class="btn" data-act="new-card">Karte schreiben</button><button class="btn ghost" data-act="view" data-v="dokumente">Zu den Dokumenten</button></div></div></div>`;
    return h;
  }
  h += `<div class="panel"><p class="lead">${list.length} von ${cs.length} Karten${fk !== 'all' ? ' · ' + esc(KFILTER[fk]) : ''}</p><div class="clist">`;
  for (const c of list) {
    const d = c.docId ? doc_(c.docId) : null;
    h += `<div class="crow">
      <div><div class="f1">${badge(c)}${esc(cut(plain(c.front), 180))}${c.kp && c.kp.length ? ` <span class="kpn">☑ ${c.kp.length}</span>` : ''}</div><div class="box"><span class="d d${c.r || 0}"></span>${c.r ? RATING[c.r] : 'Neu'}${c.reps ? ' · ' + daysLearned(c) + ' Lerntage · ' + esc(dueLabel(c)) : ''} · ${esc(chapName(c.sid, c.cid))}${d ? ' · ' + esc(cut(d.name, 22)) : ''} · Stufe ${c.box || 1}/5</div></div>
      <div class="f2">${esc(cut(plain(c.back), 220))}</div>
      <div class="acts">
        <button data-act="edit-card" data-id="${c.id}">Bearbeiten</button>
        <button data-act="del-card" data-id="${c.id}">Löschen</button>
      </div>
    </div>`;
  }
  h += '</div></div>';
  return h;
}



/* ============ Fälligkeit ============
   Leitner-artige Stufen, ohne Lernkurven-Modell: die Datenmenge in ein paar
   Wochen trägt nichts Komplexeres. Prüfungstermin deckelt die Abstände.     */
const DAY = 864e5;
const STEP = [0, 1, 2, 4, 7, 14];
function todayStart() { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); }
function examLeft(sid) {
  const su = subj(sid); if (!su || !su.exam) return null;
  const d = new Date(su.exam + 'T00:00:00'); if (isNaN(d)) return null;
  return Math.round((d.getTime() - todayStart()) / DAY);
}
function schedule(c, r) {
  let box = c.box || 1;
  if (r === 3) box = Math.min(5, box + 1);
  else if (r === 1) box = 1;
  let iv = r === 2 ? Math.max(1, Math.round(STEP[box] / 2)) : STEP[box];
  const left = examLeft(c.sid);
  if (left !== null && left > 0) iv = Math.min(iv, Math.max(1, Math.ceil(left / 2)));
  c.box = box; c.iv = iv; c.due = todayStart() + iv * DAY;
}
const isDue = c => (c.due || 0) <= todayStart();
function dueLabel(c) {
  if (!c.due) return 'fällig';
  const d = Math.round((c.due - todayStart()) / DAY);
  if (d <= 0) return d < -1 ? 'überfällig seit ' + (-d) + ' Tagen' : 'heute fällig';
  return d === 1 ? 'morgen fällig' : 'in ' + d + ' Tagen fällig';
}
function examLine(sid) {
  const l = examLeft(sid);
  if (l === null) return '';
  if (l < 0) return 'Prüfung vorbei';
  if (l === 0) return 'Prüfung ist heute';
  return 'noch ' + l + ' Tage bis zur Prüfung';
}

/* ============ Statistik ============ */
function dayKey(t) { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function ago(t) {
  if (!t) return 'nie';
  const m = Math.floor((Date.now() - t) / 60000);
  if (m < 2) return 'gerade eben';
  if (m < 60) return 'vor ' + m + ' Min';
  const h = Math.floor(m / 60); if (h < 24) return 'vor ' + h + ' Std';
  const d = Math.floor(h / 24); if (d === 1) return 'gestern';
  if (d < 31) return 'vor ' + d + ' Tagen';
  return 'vor ' + Math.floor(d / 30) + ' Monaten';
}
function scopeLog() { return (S.log || []).filter(e => !S.sel.sid || e.sid === S.sel.sid); }
function streakDays() {
  const days = new Set((S.log || []).map(e => dayKey(e.t)));
  const d = new Date(); let n = 0;
  if (!days.has(dayKey(d.getTime()))) d.setDate(d.getDate() - 1);
  while (days.has(dayKey(d.getTime()))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function stackBar(c) {
  const t = Math.max(1, c.n);
  const seg = (v, cls) => v ? `<i class="${cls}" style="width:${(v / t) * 100}%" title="${v}"></i>` : '';
  return `<div class="stack">${seg(c.r3, 'g')}${seg(c.r2, 'y')}${seg(c.r1, 'r')}${seg(c.neu, 'n')}</div>`;
}
function countSet(cards) {
  return { n: cards.length, r1: cards.filter(F.r1).length, r2: cards.filter(F.r2).length, r3: cards.filter(F.r3).length, neu: cards.filter(F.new).length };
}

function viewStats() {
  const cs = scopeCards(), log = scopeLog();
  if (!cs.length) return `<div class="panel"><div class="empty"><h2>Noch keine Zahlen</h2><p>Sobald du Karten hast und einen Durchgang machst, entsteht hier dein Verlauf.</p></div></div>`;
  const c = countSet(cs);
  const quote = c.n - c.neu ? Math.round((c.r3 / (c.n - c.neu)) * 100) : 0;
  const woche = log.filter(e => Date.now() - e.t < 7 * 864e5).reduce((a, e) => a + e.n, 0);
  const min = Math.round(log.reduce((a, e) => a + (e.secs || 0), 0) / 60);
  const str = streakDays();

  /* 14 Tage */
  const days = [];
  for (let i = 13; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const k = dayKey(d.getTime());
    days.push({ k, lbl: ['S', 'M', 'D', 'M', 'D', 'F', 'S'][d.getDay()], num: d.getDate(), n: log.filter(e => dayKey(e.t) === k).reduce((a, e) => a + e.n, 0) });
  }
  const mx = Math.max(1, ...days.map(d => d.n));

  /* nach Kapitel */
  const groups = [];
  for (const sub of (S.sel.sid ? S.subjects.filter(x => x.id === S.sel.sid) : S.subjects)) {
    for (const ch of (sub.chapters || [])) {
      const g = cs.filter(x => x.cid === ch.id); if (g.length) groups.push({ name: ch.name, sub: sub.name, c: countSet(g) });
    }
    const loose = cs.filter(x => x.sid === sub.id && !x.cid);
    if (loose.length) groups.push({ name: 'Ohne Kapitel', sub: sub.name, c: countSet(loose) });
  }
  groups.sort((a, b) => (a.c.r3 / Math.max(1, a.c.n)) - (b.c.r3 / Math.max(1, b.c.n)));

  /* Wackelkandidaten */
  const hard = cs.filter(x => daysLearned(x) >= 2)
    .map(x => { const h = dayHist(x); return { x, bad: h.filter(e => e.r === 1).length, q: h.filter(e => e.r === 3).length / Math.max(1, h.length) }; })
    .filter(o => o.q < 0.6).sort((a, b) => a.q - b.q || b.bad - a.bad).slice(0, 8);

  let h = `<div class="kpi">
    <div><div class="n">${c.n}</div><div class="l">Karten</div></div>
    <div><div class="n">${quote}%</div><div class="l">davon sicher</div></div>
    <div><div class="n">${str}</div><div class="l">Tage in Folge</div></div>
    <div><div class="n">${cs.filter(F.due).length}</div><div class="l">heute fällig</div></div>
    <div><div class="n">${min}</div><div class="l">Minuten gesamt</div></div>
  </div>`;

  const fc = [];
  for (let i = 0; i < 7; i++) {
    const t0 = todayStart() + i * DAY;
    fc.push({ d: new Date(t0), n: cs.filter(c => i === 0 ? isDue(c) : (c.due || 0) >= t0 && (c.due || 0) < t0 + DAY).length });
  }
  const fmx = Math.max(1, ...fc.map(x => x.n));
  const exL = S.sel.sid ? examLine(S.sel.sid) : '';
  h += `<div class="panel"><h2>Was wann ansteht</h2><p class="lead">Heute plus die nächsten sechs Tage.${exL ? ' ' + esc(exL) + '.' : ''}</p>
    <div class="bars">${fc.map((x, i) => `<div class="bd"><span class="v ${i === 0 ? 'now' : ''}" style="height:${x.n ? Math.max(6, (x.n / fmx) * 92) : 2}%"></span><em>${x.n || ''}</em><span class="lb">${i === 0 ? 'heute' : ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'][x.d.getDay()]}</span></div>`).join('')}</div></div>`;

  h += `<div class="panel"><h2>Letzte 14 Tage</h2><p class="lead">Wie viele Karten du pro Tag durchgegangen bist.</p>
    <div class="bars">${days.map(d => `<div class="bd"><span class="v" style="height:${d.n ? Math.max(6, (d.n / mx) * 92) : 2}%" title="${d.n} Karten"></span><em>${d.n || ''}</em><span class="lb">${d.lbl}</span></div>`).join('')}</div></div>`;

  h += `<div class="panel"><h2>Stand der Karten</h2><p class="lead">Nach der letzten Bewertung.</p>
    ${stackBar(c)}
    <div class="legend"><span><i class="g"></i>Richtig ${c.r3}</span><span><i class="y"></i>Teilweise ${c.r2}</span><span><i class="r"></i>Falsch ${c.r1}</span><span><i class="n"></i>Noch nie gelernt ${c.neu}</span></div>
    <div class="legend" style="margin-top:6px"><span><span class="bg m">★</span>${cs.filter(F.mastered).length} gefestigt</span><span><span class="bg s">⚠</span>${cs.filter(F.stuck).length} hängengeblieben</span></div></div>`;

  if (groups.length) {
    h += `<div class="panel"><h2>Nach Kapitel</h2><p class="lead">Oben steht, was am wenigsten sitzt.</p><div class="tbl">`;
    for (const g of groups) h += `<div class="tr"><div class="c1">${esc(g.name)}<span class="box">${esc(g.sub)} · ${g.c.n} Karten</span></div><div class="c2">${stackBar(g.c)}</div><div class="c3 mono">${Math.round((g.c.r3 / Math.max(1, g.c.n)) * 100)}%</div></div>`;
    h += `</div></div>`;
  }

  if (hard.length) {
    h += `<div class="panel"><h2>Wackelkandidaten</h2><p class="lead">Karten, die du mehrfach hattest und trotzdem selten sicher wusstest.</p><div class="clist">`;
    for (const o of hard) h += `<div class="crow" style="grid-template-columns:1fr auto auto"><div><div class="f1">${badge(o.x)}${esc(cut(o.x.front, 110))}</div><div class="box">${daysLearned(o.x)} Lerntage · zuletzt ${esc(ago(o.x.last))} · ${esc(chapName(o.x.sid, o.x.cid))}</div></div><div class="hist">${dayHist(o.x).slice(-8).map(e => `<span class="d d${e.r}" title="${new Date(e.t).toLocaleDateString('de-DE')}"></span>`).join('')}</div><div class="acts"><button data-act="edit-card" data-id="${o.x.id}">Ansehen</button></div></div>`;
    h += `</div></div>`;
  }

  const gaps = [];
  cs.forEach(c => (c.kp || []).forEach(k => {
    const g = (k.ok || 0) + (k.no || 0);
    if (g >= 2 && (k.no || 0) / g > 0.34) gaps.push({ t: k.t, front: c.front, id: c.id, no: k.no, g, q: (k.no || 0) / g });
  }));
  gaps.sort((a, b) => b.q - a.q || b.no - a.no);
  if (gaps.length) {
    h += `<div class="panel"><h2>Punkte, die dir fehlen</h2><p class="lead">Einzelne Kernpunkte, die du beim Abhaken am häufigsten nicht genannt hast.</p><div class="tbl">`;
    for (const g of gaps.slice(0, 10)) h += `<div class="tr" style="grid-template-columns:1fr 92px"><div class="c1">${esc(g.t)}<span class="box">${esc(cut(g.front, 60))}</span></div><div class="c3 mono">${g.no}/${g.g} gefehlt</div></div>`;
    h += `</div></div>`;
  }

  if (log.length) {
    h += `<div class="panel"><h2>Durchgänge</h2><div class="tbl">`;
    for (const e of log.slice().reverse().slice(0, 10)) {
      const q = Math.round((e.good / Math.max(1, e.n)) * 100);
      h += `<div class="tr"><div class="c1">${new Date(e.t).toLocaleDateString('de-DE', { day: '2-digit', month: 'short' })}, ${new Date(e.t).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })}<span class="box">${e.n} Karten · ${Math.max(1, Math.round((e.secs || 0) / 60))} Min${e.cid ? ' · ' + esc(chapName(e.sid, e.cid)) : ''}</span></div><div class="c2">${stackBar({ n: e.n, r3: e.good, r2: e.mid, r1: e.bad, neu: 0 })}</div><div class="c3 mono">${q}%</div></div>`;
    }
    h += `</div></div>`;
  }
  return h;
}

/* ============ Lernlogik ============ */
const F = {
  all: () => true,
  due: c => isDue(c),
  new: c => !c.seen,
  r1: c => c.r === 1,
  r2: c => c.r === 2,
  r3: c => c.r === 3,
  unsure: c => c.r === 1 || c.r === 2,
  stuck: c => isStuck(c),
  mastered: c => isMastered(c)
};
const RATING = { 1: 'Falsch', 2: 'Teilweise', 3: 'Richtig' };
/* Pro Kalendertag zählt nur die ERSTE Bewertung. Wiederholungen innerhalb
   derselben Sitzung sind Nachlernen, kein Beleg fürs Behalten.            */
function dayHist(c) {
  const h = c.hist || [], out = []; let last = null;
  for (const e of h) { const k = dayKey(e.t); if (k !== last) { out.push(e); last = k; } }
  return out;
}
function tail(c) {
  const h = dayHist(c); if (!h.length) return { r: 0, n: 0 };
  const r = h[h.length - 1].r; let n = 0;
  for (let i = h.length - 1; i >= 0 && h[i].r === r; i--) n++;
  return { r, n };
}
const daysLearned = c => dayHist(c).length;
const isMastered = c => { const t = tail(c); return t.r === 3 && t.n >= 3; };
const isStuck = c => { const t = tail(c); return t.r === 1 && t.n >= 3; };
const badge = c => isMastered(c) ? '<span class="bg m" title="an drei Lerntagen hintereinander richtig">★</span>'
  : isStuck(c) ? '<span class="bg s" title="an drei Lerntagen hintereinander falsch">⚠</span>' : '';
function startSession(force) {
  const mode = force ? 'shuffle' : $('#oMode').value;
  const filter = force || $('#oFilter').value;
  const limit = force ? 0 : +$('#oLimit').value;

  sess = { queue: cs.map(c => c.id), idx: 0, flip: false, done: false, weak: [], t0: Date.now(), checks: new Set(), stats: { good: 0, mid: 0, bad: 0 } };

/* ============ Dokumente einlesen ============ */
function blocksFromHTML(html) {
  const dom = new DOMParser().parseFromString(html, 'text/html');
  const out = [];
  dom.body.querySelectorAll('h1,h2,h3,h4,h5,h6,p,li,td,th').forEach(el => {
    if (el.closest('li') && el.tagName !== 'LI') return;
    const t = el.textContent.replace(/\s+/g, ' ').trim();
    if (!t) return;
    let tag = el.tagName.toLowerCase();
    if (tag === 'li') tag = 'li';
    else if (tag === 'td' || tag === 'th') tag = 'p';
    else if (tag === 'h5' || tag === 'h6') tag = 'h4';
    else if (tag === 'p') {
      const b = el.querySelector('strong,b');
      if (b && b.textContent.trim().length >= t.length - 2 && t.length < 90 && !/[.:;,]$/.test(t)) tag = 'h3';
    }
    out.push({ tag, text: t });
  });
  return out;
}
function blocksFromText(txt) {
  const out = [];
  txt.split(/\r?\n/).forEach(line => {
    const t = line.trim(); if (!t) return;
    let m = t.match(/^(#{1,4})\s+(.*)$/);
    if (m) return out.push({ tag: 'h' + m[1].length, text: m[2].trim() });
    m = t.match(/^([-*•–]|\d+[.)])\s+(.*)$/);
    if (m) return out.push({ tag: 'li', text: m[2].trim() });
    if (t.length < 70 && /^[A-ZÄÖÜ0-9][^.!?]*$/.test(t) && !/[.:;]$/.test(t)) return out.push({ tag: 'h3', text: t });
    out.push({ tag: 'p', text: t });
  });
  return out;
}
async function readFile(file) {
  const name = file.name.replace(/\.[^.]+$/, '');
  if (/\.docx$/i.test(file.name)) {
    if (!window.mammoth) throw new Error('Der Word-Leser konnte nicht geladen werden. Nutz solange „Text einfügen“.');
    const buf = await file.arrayBuffer();
    const res = await window.mammoth.convertToHtml({ arrayBuffer: buf });
    return { name, blocks: blocksFromHTML(res.value) };
  }
  const txt = await file.text();
  if (/\.html?$/i.test(file.name)) return { name, blocks: blocksFromHTML(txt) };
  return { name, blocks: blocksFromText(txt) };
}
async function handleFiles(files) {
  if (!S.subjects.length) { toast('Leg zuerst ein Fach an.'); return newSubject(); }
  for (const f of files) {
    try {
      const { name, blocks } = await readFile(f);
      if (!blocks.length) { toast('In „' + f.name + '“ war kein Text zu finden.'); continue; }
      addDoc(name, blocks);
    } catch (e) { toast(e.message || 'Datei konnte nicht gelesen werden.'); }
  }
}
function addDoc(name, blocks) {
  const t = targetChapter();
  const sid = t.sid || S.subjects[0].id;
  const d = { id: uid(), sid, cid: t.cid || null, name, blocks, created: Date.now() };
  S.docs.push(d);
  S.sel = { sid: d.sid, cid: d.cid || (S.sel.cid === '__none__' ? '__none__' : null) };
  reader.docId = d.id; resetPend();

}

/* ============ Auto-Scan ============ */
function autoExtract(blocks) {
  const out = [], isH = b => /^h[1-4]$/.test(b.tag);
  const seen = new Set();
  const push = (front, back, kind, ord) => {
    front = (front || '').trim(); back = (back || '').trim();
    if (front.length < 3 || back.length < 3) return;
    if (front.length > 200) return;
    const k = front.toLowerCase().slice(0, 60);
    if (seen.has(k)) return; seen.add(k);
    out.push({ front, back: cut(back, 900), kind, ord });
  };
  for (let i = 0; i < blocks.length; i++) {
    const b = blocks[i];
    if (isH(b)) {
      const body = [];
      for (let j = i + 1; j < blocks.length && !isH(blocks[j]); j++) body.push(blocks[j]);
      if (body.length) push(b.text, body.map(x => x.tag === 'li' ? '• ' + x.text : x.text).join('\n'), 'Abschnitt', i);
      continue;
    }
    if (b.text.endsWith('?') && b.text.length < 200) {
      const nx = blocks[i + 1];
      if (nx && !isH(nx)) { push(b.text, nx.text, 'Frage', i); continue; }
    }
    const m = b.text.match(/^\s*([^.:–—]{3,70}?)\s*(:|\s–\s|\s—\s|\s-\s|\sist\s|\sbezeichnet\s|\sbedeutet\s|\sversteht man\s)\s*(.{15,})$/);
    if (m && !/^\d+$/.test(m[1]) && /[A-Za-zÄÖÜäöü]/.test(m[1])) {
      const wordSep = /[a-zä]/.test(m[2]);
      push(m[1], wordSep ? b.text : m[3], 'Begriff', i);
    }
  }
  return out;
}

  const d = doc_(docId); if (!d) return;
  const found = autoExtract(d.blocks);
  if (!found.length) return toast('Der Auto-Scan hat nichts Verwertbares gefunden. Markier die Stellen lieber selbst.');
  window._auto = { docId, found };
  openModal(`
    <div class="head"><h2>Auto-Scan: ${found.length} Vorschläge</h2><button class="x" data-act="close-modal">✕</button></div>
    <div class="body">
      <p class="lead">Aus Überschriften, Fragen und Definitionen in „${esc(d.name)}“. Hak ab, was du behalten willst – bearbeiten kannst du alles später.</p>
      <div class="row" style="margin-bottom:10px"><button class="btn sm ghost" data-act="sel-all">Alle</button><button class="btn sm ghost" data-act="sel-none">Keine</button></div>
      <div class="prev">
        ${found.map((f, i) => `<label><input type="checkbox" class="pv" data-i="${i}" checked><span><span class="chip" style="margin-right:6px">${f.kind}</span><span class="q">${esc(f.front)}</span><span class="a">${esc(f.back)}</span></span></label>`).join('')}
      </div>
    </div>
    <div class="foot"><button class="btn ghost" data-act="close-modal">Abbrechen</button><button class="btn" data-act="take-auto">Karten übernehmen</button></div>`);
}
function takeAuto() {
  const { docId, found } = window._auto || {}; const d = doc_(docId); if (!d) return;
  let n = 0;
  document.querySelectorAll('.pv').forEach(cb => {
    if (!cb.checked) return;
    const f = found[+cb.dataset.i];
    S.cards.push({ id: uid(), sid: d.sid, cid: d.cid, front: f.front, back: f.back, docId: d.id, ord: f.ord, marks: [], box: 1, created: Date.now() + n });

/* ============ Leser + Marker ============ */
function resetPend() {

  reader.auto = { front: true, back: true };
}

  const d = doc_(reader.docId), el = $('#reader'); if (!d || !el) return;
  const keep = reader.painted === d.id ? (el.scrollTop || reader.scroll || 0) : 0;
  const saved = [];
  S.cards.filter(c => c.docId === d.id).forEach(c => (c.marks || []).forEach(m => saved.push({ ...m, side: 'saved' })));
  const all = [
    ...reader.pend.front.map(m => ({ ...m, side: 'front' })),
    ...reader.pend.back.map(m => ({ ...m, side: 'back' })),
    ...saved

  const byBlock = {};
  all.forEach(m => { (byBlock[m.bi] = byBlock[m.bi] || []).push(m); });
  el.innerHTML = d.blocks.map((b, i) => {
    const ms = (byBlock[i] || []).slice().sort((x, y) => x.s - y.s);
    let out = '', pos = 0;
    for (const m of ms) {
      const s = Math.max(m.s, pos), e = Math.max(m.e, pos);
      if (e <= s) continue;
      out += esc(b.text.slice(pos, s)) + '<span class="mk mk-' + m.side + '">' + esc(b.text.slice(s, e)) + '</span>';
      pos = e;
    }
    out += esc(b.text.slice(pos));
    return '<div class="blk ' + b.tag + '" data-i="' + i + '">' + (out || '&nbsp;') + '</div>';

  const b1 = bOf(r.startContainer), b2 = bOf(r.endContainer);

    const t = d.blocks[i].text;
    const s = i === i1 ? o1 : 0, e = i === i2 ? o2 : t.length;

    t.selectionStart = s0; t.selectionEnd = s0 + nv.length;
  }
  t.focus(); syncField(t);
}

/* ============ Supabase-Synchronisation ============
   Optional hier fest eintragen, dann muss man es auf keinem Gerät mehr tippen.
   Der anon-Key ist zur Veröffentlichung gedacht; geschützt wird durch die
   Row-Level-Security-Regeln plus deine Anmeldung.                              */
const SUPA_URL_FIX = '';
const SUPA_KEY_FIX = '';

let sy = { url: '', key: '', tok: null, ref: null, uid: null, mail: '', last: 0, busy: false, err: '' };
let pushTimer = null;

async function syLoad() {
  try { const raw = await get('kk_sync'); if (raw) Object.assign(sy, JSON.parse(raw)); } catch (e) { }
  if (SUPA_URL_FIX) sy.url = SUPA_URL_FIX;
  if (SUPA_KEY_FIX) sy.key = SUPA_KEY_FIX;
  sy.url = (sy.url || '').replace(/\/+$/, '');
}
function syPersist() {
  const d = { url: sy.url, key: sy.key, tok: sy.tok, ref: sy.ref, uid: sy.uid, mail: sy.mail };
  try { put('kk_sync', JSON.stringify(d)); } catch (e) { }
}
const syOn = () => !!(sy.url && sy.key && sy.tok && sy.uid);

function pill(state, text) {
  const el = $('#syncPill'); if (!el) return;
  el.className = 'pill' + (state ? ' ' + state : '');
  el.textContent = text;
}
function pillIdle() {
  if (!sy.url || !sy.key) return pill('', 'Sync einrichten');
  if (!sy.tok) return pill('err', 'Nicht angemeldet');
  if (sy.err) return pill('err', 'Sync-Fehler');
  if (!sy.last) return pill('ok', 'Verbunden');
  const m = Math.round((Date.now() - sy.last) / 60000);
  pill('ok', m < 1 ? 'Synchron' : 'Synchron vor ' + m + ' Min');
}

async function api(path, opts, auth, retried) {
  opts = opts || {};
  const h = Object.assign({ apikey: sy.key, 'Content-Type': 'application/json' }, opts.headers || {});
  if (auth !== false && sy.tok) h.Authorization = 'Bearer ' + sy.tok;
  const r = await fetch(sy.url + path, Object.assign({}, opts, { headers: h }));
  if (r.status === 401 && auth !== false && sy.ref && !retried) {
    if (await syRefresh()) return api(path, opts, auth, true);
  }
  return r;
}
async function syRefresh() {
  const r = await api('/auth/v1/token?grant_type=refresh_token', { method: 'POST', body: JSON.stringify({ refresh_token: sy.ref }) }, false, true);
  const d = await r.json().catch(() => ({}));
  if (r.ok && d.access_token) { sy.tok = d.access_token; sy.ref = d.refresh_token; syPersist(); return true; }
  sy.tok = null; syPersist(); return false;
}
async function syAuth(mail, pw, signup) {
  const path = signup ? '/auth/v1/signup' : '/auth/v1/token?grant_type=password';
  const r = await api(path, { method: 'POST', body: JSON.stringify({ email: mail, password: pw }) }, false);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.msg || d.error_description || d.message || ('Anmeldung fehlgeschlagen (' + r.status + ')'));
  if (!d.access_token) throw new Error('Konto angelegt. Bestätige die Mail von Supabase, dann melde dich an.');
  sy.tok = d.access_token; sy.ref = d.refresh_token;
  sy.uid = (d.user || {}).id; sy.mail = (d.user || {}).email || mail;
  sy.err = ''; syPersist();
}

function sig(o) {
  const p = a => (a || []).map(x => x.id + ':' + (x.mtime || x.created || 0)).sort().join(',');
  return p(o.subjects) + '|' + p(o.cards) + '|' + p(o.docs) + '|' + p(o.log) + '|' + Object.keys(o.del || {}).sort().join(',');
}
function mergeList(a, b, del) {
  const ts = x => x.mtime || x.created || 0, m = new Map();
  (a || []).concat(b || []).forEach(x => { const p = m.get(x.id); if (!p || ts(x) >= ts(p)) m.set(x.id, x); });
  return [...m.values()].filter(x => !(del[x.id] && del[x.id] >= ts(x)));
}
function mergeState(loc, rem) {
  const del = Object.assign({}, rem.del || {});
  Object.keys(loc.del || {}).forEach(k => { if (!del[k] || loc.del[k] > del[k]) del[k] = loc.del[k]; });
  return {
    subjects: mergeList(loc.subjects, rem.subjects, del),
    cards: mergeList(loc.cards, rem.cards, del),
    docs: mergeList(loc.docs, rem.docs, del),
    log: mergeList(loc.log, rem.log, del).sort((a, b) => a.t - b.t).slice(-400),
    del
  };
}

function schedulePush() {
  if (!syOn()) return;

async function syncNow(quiet) {
  if (!syOn()) { pillIdle(); return; }
  if (sy.busy) return;
  sy.busy = true; pill('busy', 'Synchronisiert …');
  try {
    const r = await api('/rest/v1/kasten?select=data&user_id=eq.' + sy.uid);
    if (!r.ok) throw new Error('Serverantwort ' + r.status + ' beim Laden');
    const rows = await r.json();
    let changed = false;
    if (rows[0] && rows[0].data) {
      const before = sig(snapshot());
      const m = mergeState(snapshot(), rows[0].data);
      S.subjects = m.subjects; S.cards = m.cards; S.docs = m.docs; S.log = m.log; S.del = m.del;
      changed = sig(snapshot()) !== before;
    }
    const w = await api('/rest/v1/kasten', {
      method: 'POST',
      headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify({ user_id: sy.uid, data: snapshot(), updated_at: new Date().toISOString() })
    });
    if (!w.ok) {
      const t = await w.text().catch(() => '');
      throw new Error(w.status === 404 ? 'Tabelle „kasten“ fehlt – lies das SQL aus dem Sync-Fenster ein.' : 'Serverantwort ' + w.status + ' beim Speichern' + (t ? ': ' + cut(t, 90) : ''));
    }
    sy.last = Date.now(); sy.err = '';
    saveLocal();
    if (changed && !(sess && !sess.done) && $('#ov').hidden) render();
    pillIdle();
    if (!quiet) toast('Alles synchron.');
  } catch (e) {
    sy.err = e.message; pill('err', 'Sync-Fehler');
    if (!quiet) toast(e.message);
  } finally { sy.busy = false; }
}

  if (e.target.classList && e.target.classList.contains('rt')) dashToBullet(e.target);
  if (e.target.id === 'pFront' || e.target.id === 'pBack' || e.target.id === 'pKP') {
    const map = { pFront: 'front', pBack: 'back', pKP: 'kp' };
    const side = map[e.target.id];
    reader.text[side] = e.target.value;
    if (side !== 'kp') reader.auto[side] = false;
    updateBar();
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'kFilter') { window._f = e.target.value; render(); return; }
  if (e.target.id === 'kSort') { window._s = e.target.value; render(); return; }
  if (e.target.id === 'mSid') {
    const s = subj(e.target.value);
    $('#mCid').innerHTML = '<option value="">Ohne Kapitel</option>' + ((s && s.chapters) || []).map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('');
  }
});
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if (e.key === 'Escape') { if (!$('#ov').hidden) closeModal(); return; }
  const ta = e.target.tagName === 'TEXTAREA' && e.target.classList.contains('rt');
  if (ta && e.key === 'Enter' && !e.shiftKey && !e.ctrlKey && !e.metaKey) { autoBullet(e); return; }
  if (e.target.tagName === 'TEXTAREA' && (e.ctrlKey || e.metaKey) && (e.key === 'b' || e.key === 'i')) {
    e.preventDefault(); wrapSel(e.key === 'b' ? '**' : '*'); return;
  }
  if (typing) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && reader.docId && S.view === 'dokumente') { e.preventDefault(); saveMark(); }
    return;
  }
  if (S.view === 'dokumente' && reader.docId && $('#ov').hidden) {
    if (e.key === '1') { e.preventDefault(); applyMark('front'); }
    if (e.key === '2') { e.preventDefault(); applyMark('back'); }
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); saveMark(); }
  }
  if (S.view === 'lernen' && sess && !sess.done) {
    if (e.key === ' ') { e.preventDefault(); sess.flip = !sess.flip; render(); }
    if (sess.flip && ['1', '2', '3'].includes(e.key)) { e.preventDefault(); rate(+e.key); }
  }
});

/* ============ Start ============ */
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && syOn() && Date.now() - sy.last > 30000) syncNow(true);
});
window.addEventListener('online', () => { if (syOn()) syncNow(true); });
setInterval(() => { if (!sy.busy) pillIdle(); }, 60000);

(async () => {
  await load();
  await syLoad();
  if (!S.cards.length && !S.docs.length) S.view = 'dokumente';
  render();
  pillIdle();
  if (syOn()) syncNow(true);
})();

</script>
</body>
